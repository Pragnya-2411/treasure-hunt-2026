<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Treasure Hunt</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    min-height: 100vh;
    font-family: Arial, sans-serif;
    background: #f3f3f3;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px;
}

.card {
    width: min(460px, 100%);
    background: white;
    border-radius: 20px;
    padding: 28px;
    box-shadow: 0 8px 30px #0002;
    text-align: center;
}

h1 {
    margin: 0 0 8px;
}

.checkpoint {
    color: #666;
    margin-bottom: 22px;
    line-height: 1.5;
}

input {
    width: 100%;
    padding: 14px;
    border: 2px solid #ddd;
    border-radius: 12px;
    font-size: 16px;
    text-align: center;
    margin: 10px 0;
    outline: none;
}

input:focus {
    border-color: #111;
}

button {
    width: 100%;
    padding: 14px;
    border: 0;
    border-radius: 12px;
    background: #111;
    color: white;
    font-size: 16px;
    font-weight: bold;
    cursor: pointer;
}

button:disabled {
    background: #777;
    cursor: not-allowed;
}

.hidden {
    display: none;
}

.message {
    margin-top: 16px;
    padding: 14px;
    border-radius: 12px;
    font-weight: bold;
    line-height: 1.5;
}

.error {
    background: #ffe8e8;
    color: #a40000;
}

.success {
    background: #e8f8ec;
    color: #146b2e;
}

.clue {
    margin-top: 20px;
    padding: 20px;
    border-radius: 14px;
    background: #fafafa;
    border: 1px solid #ddd;
    line-height: 1.7;
    text-align: left;
    white-space: pre-line;
}
</style>
</head>

<body>

<div class="card">
    <div id="app"></div>
</div>

<script>

const routes = {

    red: {
        route: "A",
        clues: {
            A1: "ROUTE A CHECKPOINT 1 CLUE",
            A2: "ROUTE A CHECKPOINT 2 CLUE",
            A3: "ROUTE A CHECKPOINT 3 CLUE",
            A4: "COMMON FINAL ARCHITECTURE CLUE"
        }
    },

    blue: {
        route: "B",
        clues: {
            B1: "ROUTE B CHECKPOINT 1 CLUE",
            B2: "ROUTE B CHECKPOINT 2 CLUE",
            B3: "ROUTE B CHECKPOINT 3 CLUE",
            B4: "COMMON FINAL ARCHITECTURE CLUE"
        }
    },

    green: {
        route: "C",
        clues: {
            C1: "ROUTE C CHECKPOINT 1 CLUE",
            C2: "ROUTE C CHECKPOINT 2 CLUE",
            C3: "ROUTE C CHECKPOINT 3 CLUE",
            C4: "COMMON FINAL ARCHITECTURE CLUE"
        }
    },

    yellow: {
        route: "D",
        clues: {
            D1: "ROUTE D CHECKPOINT 1 CLUE",
            D2: "ROUTE D CHECKPOINT 2 CLUE",
            D3: "ROUTE D CHECKPOINT 3 CLUE",
            D4: "COMMON FINAL ARCHITECTURE CLUE"
        }
    },

    purple: {
        route: "E",
        clues: {
            E1: "ROUTE E CHECKPOINT 1 CLUE",
            E2: "ROUTE E CHECKPOINT 2 CLUE",
            E3: "ROUTE E CHECKPOINT 3 CLUE",
            E4: "COMMON FINAL ARCHITECTURE CLUE"
        }
    },

    orange: {
        route: "F",
        clues: {
            F1: "ROUTE F CHECKPOINT 1 CLUE",
            F2: "ROUTE F CHECKPOINT 2 CLUE",
            F3: "ROUTE F CHECKPOINT 3 CLUE",
            F4: "COMMON FINAL ARCHITECTURE CLUE"
        }
    },

    pink: {
        route: "G",
        clues: {
            G1: "ROUTE G CHECKPOINT 1 CLUE",
            G2: "ROUTE G CHECKPOINT 2 CLUE",
            G3: "ROUTE G CHECKPOINT 3 CLUE",
            G4: "COMMON FINAL ARCHITECTURE CLUE"
        }
    }

};


const params = new URLSearchParams(window.location.search);

const color = (params.get("color") || "")
    .toLowerCase()
    .trim();

const checkpoint = (params.get("checkpoint") || "")
    .toUpperCase()
    .trim();

const app = document.getElementById("app");


/* INVALID QR */

if (!routes[color] || !routes[color].clues[checkpoint]) {

    app.innerHTML = `
        <h1>Treasure Hunt 🔎</h1>

        <p class="checkpoint">
            Invalid QR code.
        </p>

        <small>
            Please scan the QR code provided at your checkpoint.
        </small>
    `;

}


/* VALID QR */

else {

    const route = routes[color];

    /*
       The QR's color is intentionally NOT shown.
       Otherwise the participant would already know
       what color to enter.
    */

    app.innerHTML = `

        <h1>🔐 Checkpoint ${checkpoint}</h1>

        <p class="checkpoint">
            Enter the color printed on your team's
            wristband to unlock the clue.
        </p>

        <input
            id="colorInput"
            type="text"
            placeholder="Enter your band color"
            autocomplete="off"
        >

        <button id="unlockButton">
            UNLOCK CLUE
        </button>

        <div id="message"></div>

        <div id="clueBox" class="hidden"></div>
    `;


    function checkColor() {

        const enteredColor =
            document
            .getElementById("colorInput")
            .value
            .toLowerCase()
            .trim();

        const message =
            document.getElementById("message");

        const clueBox =
            document.getElementById("clueBox");


        /* CORRECT COLOR */

        if (enteredColor === color) {

            message.className = "message success";

            message.textContent =
                "✓ Correct color! Your clue has been unlocked.";

            clueBox.className = "clue";

            clueBox.textContent =
                route.clues[checkpoint];

            document
                .getElementById("colorInput")
                .disabled = true;

            document
                .getElementById("unlockButton")
                .disabled = true;
        }


        /* WRONG COLOR */

        else {

            message.className = "message error";

            message.textContent =
                "✗ Incorrect color. This checkpoint belongs to another team. Check your wristband and try again.";

            clueBox.className = "hidden";
        }
    }


    document
        .getElementById("unlockButton")
        .addEventListener("click", checkColor);


    document
        .getElementById("colorInput")
        .addEventListener("keydown", function(event) {

            if (event.key === "Enter") {
                checkColor();
            }

        });

}

</script>

</body>
</html>
